name: Clepsy
options:
  bundleIdPrefix: com.clepsy
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  Clepsy:
    type: application
    platform: iOS
    sources:
      - path: Clepsy
        excludes:
          - Info.plist
    info:
      path: Clepsy/Generated-Info.plist
      properties:
        CFBundleDisplayName: Clepsy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSFamilyControlsUsageDescription: "Clepsy needs permission to monitor app usage and manage screen time to help you trade productive time for social media access."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.clepsy.app
            CFBundleURLSchemes:
              - clepsy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clepsy.app
        CODE_SIGN_ENTITLEMENTS: Clepsy/Clepsy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - target: ClepsyMonitor
        embed: true
      - target: ClepsyShieldConfiguration
        embed: true
      - target: ClepsyShieldAction
        embed: true
    scheme:
      testTargets:
        - ClepsyTests
    entitlements:
      path: Clepsy/Clepsy.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.clepsy.shared

  ClepsyMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ClepsyMonitor
      # Include shared models and services
      - path: Clepsy/Models/TimeEvent.swift
      - path: Clepsy/Services/SharedStorageService.swift
    info:
      path: ClepsyMonitor/Generated-Info.plist
      properties:
        CFBundleDisplayName: ClepsyMonitor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clepsy.app.monitor
        CODE_SIGN_ENTITLEMENTS: ClepsyMonitor/ClepsyMonitor.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
    entitlements:
      path: ClepsyMonitor/ClepsyMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.clepsy.shared

  ClepsyShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: ClepsyShieldConfiguration
      - path: Clepsy/Models/TimeEvent.swift
      - path: Clepsy/Services/SharedStorageService.swift
    info:
      path: ClepsyShieldConfiguration/Generated-Info.plist
      properties:
        CFBundleDisplayName: ClepsyShieldConfiguration
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShieldConfigurationExtension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clepsy.app.shieldconfiguration
        CODE_SIGN_ENTITLEMENTS: ClepsyShieldConfiguration/ClepsyShieldConfiguration.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
      - sdk: FamilyControls.framework
    entitlements:
      path: ClepsyShieldConfiguration/ClepsyShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.clepsy.shared

  ClepsyShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ClepsyShieldAction
      - path: Clepsy/Models/TimeEvent.swift
      - path: Clepsy/Services/SharedStorageService.swift
    info:
      path: ClepsyShieldAction/Generated-Info.plist
      properties:
        CFBundleDisplayName: ClepsyShieldAction
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShieldActionExtension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clepsy.app.shieldaction
        CODE_SIGN_ENTITLEMENTS: ClepsyShieldAction/ClepsyShieldAction.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
    entitlements:
      path: ClepsyShieldAction/ClepsyShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.clepsy.shared

  ClepsyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClepsyTests
    info:
      path: ClepsyTests/Generated-Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clepsy.app.tests
    dependencies:
      - target: Clepsy
